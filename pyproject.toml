[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-flow-guard"
version = "0.1.0"
description = "Defensive AI network intrusion detection for campus and laboratory networks."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
  { name = "CampusFlowGuard contributors" },
]
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "pyarrow>=17,<26",
  "PyYAML>=6,<7",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
ml = [
  "tensorflow==2.17.1",
  "keras==3.15.0",
]
api = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "python-multipart==0.0.20",
  "httpx>=0.27,<1",
]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.8.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
campus_flow_guard = ["static/*.html"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
