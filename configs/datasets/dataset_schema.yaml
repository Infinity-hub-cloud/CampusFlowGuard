  - RETRANSMITTED_IN_BYTES
  - TCP_WIN_MAX_OUT
  - L7_PROTO
  - RETRANSMITTED_OUT_PKTS
  - RETRANSMITTED_IN_PKTS

categorical_columns:
  - CLIENT_TCP_FLAGS
  - L4_SRC_PORT
  - TCP_FLAGS
  - ICMP_IPV4_TYPE
  - ICMP_TYPE
  - PROTOCOL
  - SERVER_TCP_FLAGS
  - L4_DST_PORT
  - L7_PROTO

label_column: Attack
benign_label: Benign
time_column: null
test_column: null

notes:
  - The original specification does not define a timestamp or ordering column.
  - The original implementation assumes row order for LastRows and sliding windows.
  - The source URL and file hash require confirmation before a real experiment.
